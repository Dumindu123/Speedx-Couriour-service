<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CourierPro Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
</head>
<body>

<div class="login-container">

    <div class="login-card">
        <h2>Customer Login</h2>
        <form id="customerLoginForm" onsubmit="return customerLogin()">
            <input type="email" id="customerEmail" placeholder="Email Address" required>
            <input type="password" id="customerPassword" placeholder="Password" required>
            <button type="submit">Login</button>
            <p>Don't have an account? <a href="#">Register</a></p>
        </form>
    </div>

    <div class="login-card admin-card">
        <h2>Admin Login</h2>
        <form id="adminLoginForm" onsubmit="return adminLogin()">
            <input type="email" id="adminEmail" placeholder="Admin Email" required>
            <input type="password" id="adminPassword" placeholder="Password" required>
            <button type="submit">Login</button>
            <p>Forgot password? <a href="#">Reset</a></p>
        </form>
    </div>

</div>

<script src="login.js"></script>
</body>
</html>
